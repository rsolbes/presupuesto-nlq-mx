- id: P0016
  pregunta: Cuanto recurso se proporcionó a Michoacán correspondiente al Fondo de Aportaciones para la Nómina Educativa y Gasto Operativo (FONE) entre 2024 y 2025.
  ruta: sql
  comportamiento: responder
  origen:
    tipo: solicitud_pnt
    referencia: folio 340026300014226
  sql: |
    SELECT ejercicio, programa_clave, programa, sum(pagado) AS pagado
    FROM semantica.gasto
    WHERE ejercicio IN (2024, 2025)
      AND ramo_clave = 33
      AND programa_clave IN ('I013', 'I014', 'I015', 'I016')
      AND entidad_federativa = 'Michoacán'
    GROUP BY ejercicio, programa_clave, programa
    ORDER BY ejercicio, programa_clave
  autor: asistente-ia
  estado: propuesta
  fecha: '2026-09-18'
  notas: '''Se proporcionó'' se lee como pagado. El FONE se compone de cuatro programas del ramo 33 (I013 a I016), que la base solo nombra por sigla: el nombre completo que usa el ciudadano no aparece en ningún catálogo. La solicitud pide además desglosar por programa o rubro, que es lo que agrupa el SQL.'

