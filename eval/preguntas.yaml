- id: P0012
  pregunta: Solicito información sobre la distribución del presupuesto destinado al sector salud
  ruta: sql
  comportamiento: ambigua
  origen:
    tipo: solicitud_pnt
    referencia: folio 340026300235126
  interpretaciones:
  - supuesto: 'Clasificación funcional: función Salud, ejercicio más reciente (2025), presupuesto aprobado por ramo'
    sql: |
      SELECT ramo, sum(aprobado) AS aprobado
      FROM semantica.gasto
      WHERE ejercicio = 2025
        AND funcion = 'Salud'
      GROUP BY ramo
      ORDER BY aprobado DESC
  - supuesto: 'Clasificación administrativa: ramo 12 Salud, ejercicio más reciente (2025), presupuesto aprobado por programa'
    sql: |
      SELECT programa_clave, programa, sum(aprobado) AS aprobado
      FROM semantica.gasto
      WHERE ejercicio = 2025
        AND ramo_clave = 12
      GROUP BY programa_clave, programa
      ORDER BY aprobado DESC
  autor: asistente-ia
  estado: propuesta
  fecha: '2026-09-18'
  notas: 'No indica ejercicio. ''Sector salud'' admite lectura funcional o administrativa, con resultados muy distintos: el ramo 12 concentra una fracción menor del gasto en salud, que fluye sobre todo por IMSS, ISSSTE y aportaciones a entidades. ''Destinado'' se lee como aprobado.'

