- id: P0029
  pregunta: Solicito conocer el monto total ejercido por la Secretaría de Gobernación en publicidad oficial durante el año 2024
  ruta: sql
  comportamiento: responder
  origen:
    tipo: solicitud_pnt
    referencia: folio 340026300186625
  sql: |
    SELECT sum(ejercido) AS ejercido
    FROM semantica.gasto
    WHERE ejercicio = 2024
      AND ramo_clave = 4
      AND partida_clave BETWEEN 36000 AND 36999
  autor: asistente-ia
  estado: propuesta
  fecha: '2026-09-21'
  notas: '''Publicidad oficial'' se lee como el concepto 3600 del Clasificador por Objeto del Gasto, cuyo nombre oficial es ''Servicios de comunicación social y publicidad''. Resultado: 176.8 millones. Alternativa por verificar: solo la partida 36101, ''Difusión de mensajes sobre programas y actividades gubernamentales'', da 175.9 millones; la diferencia es la partida 36901 de monitoreo de medios. La solicitud pide además el desglose por medio de comunicación, que la base no tiene, fuera del fragmento.'

