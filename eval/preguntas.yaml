- id: P0001
  pregunta: Solicito el monto total ejercido en combustible para vehiculos oficiales en 2025
  ruta: sql
  comportamiento: ambigua
  origen:
    tipo: solicitud_pnt
    referencia: folio 340026300036626
  interpretaciones:
  - supuesto: Todas las partidas de combustible para vehículos (26101 a 26104), gobierno federal completo
    sql: |
      SELECT sum(ejercido) AS ejercido
      FROM semantica.gasto
      WHERE ejercicio = 2025
        AND partida_clave BETWEEN 26101 AND 26104
  - supuesto: Solo combustible para vehículos de servicios administrativos y asignados a servidores públicos (26103 y 26104), gobierno federal completo
    sql: |
      SELECT sum(ejercido) AS ejercido
      FROM semantica.gasto
      WHERE ejercicio = 2025
        AND partida_clave IN (26103, 26104)
  autor: asistente-ia
  estado: propuesta
  fecha: '2026-09-18'
  notas: 'Etapa explícita: ejercido. La solicitud iba dirigida a la SHCP, pero leída literalmente no indica de quién son los vehículos; el sistema no conoce al destinatario. La ambigüedad está en qué partidas cuentan como ''vehículos oficiales''.'

