#     SELECT <...>
#     FROM semantica.gasto
#     WHERE <...>
#   verificacion:
#     documento: "<documento oficial que confirma la respuesta>"
#     ubicacion: "<pagina, cuadro o renglon>"
#     valor: "<cifra tal como aparece>"
#   autor: RSD
#   fecha: 2026-09-18
#
# --- Pregunta ambigua ---
