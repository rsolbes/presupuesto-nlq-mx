- id: P0006
  pregunta: Solicito el desglose del presupuesto asignado al CONAFE en el ejercicio fiscal 2024, indicando las partidas presupuestarias, montos ejercidos y subeiercidos
  ruta: sql
  comportamiento: responder
  origen:
    tipo: solicitud_pnt
    referencia: folio 340026300019726
  sql: |
    SELECT partida_clave, partida,
           sum(aprobado) AS asignado,
           sum(ejercido) AS ejercido,
           sum(modificado) - sum(devengado) AS subejercicio
    FROM semantica.gasto
    WHERE ejercicio = 2024
      AND ramo_clave = 11
      AND unidad_responsable_clave = 'L6W'
    GROUP BY partida_clave, partida
    ORDER BY partida_clave
  autor: asistente-ia
  estado: propuesta
  fecha: '2026-09-18'
  notas: '''Asignado'' se lee como aprobado. ''Subejercido'' se calcula como modificado menos devengado: es la definición de la Cuenta Pública, verificada en el estado analítico del ISSSTE 2024, donde la columna de subejercicio es exactamente esa diferencia. El CONAFE es la unidad L6W del ramo 11. Se conserva la errata ''subeiercidos'' del original. La solicitud pide además informes trimestrales, fuera del fragmento.'

- id: P0007
  pregunta: La relación de los programas presupuestarios vinculados con el saneamiento de aguas residuales y el tratamiento de aguas residuales.
  ruta: sql
  comportamiento: ambigua
  origen:
    tipo: solicitud_pnt
    referencia: folio 340026300226326
  interpretaciones:
  - supuesto: Programas clasificados en la subfunción Ordenación de Aguas Residuales, Drenaje y Alcantarillado, 2020 a 2025
    sql: |
      SELECT DISTINCT programa_clave, programa, ramo
      FROM semantica.gasto
      WHERE subfuncion = 'Ordenación de Aguas Residuales, Drenaje y Alcantarillado'
      ORDER BY programa_clave, ramo
  - supuesto: Programas cuyo nombre menciona aguas residuales o saneamiento, 2020 a 2025
    sql: |
      SELECT DISTINCT programa_clave, programa, ramo
      FROM semantica.gasto
      WHERE programa ILIKE '%residual%'
         OR programa ILIKE '%saneamiento%'
      ORDER BY programa_clave, ramo
  autor: asistente-ia
  estado: propuesta
  fecha: '2026-09-18'
  notas: El fragmento no indica periodo; la solicitud completa pide 2018 a 2026, parcialmente fuera de la base. 'Vinculados' admite lectura por clasificación funcional o por nombre del programa.

